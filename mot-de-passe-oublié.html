<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupération de mot de passe | UV-PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --uv-purple: #a855f7; --dark-bg: #0f0f1a; --card-bg: #161625; --success-green: #28a745; --border-color: #2a2a40; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        nav { background-color: #0a0a12; height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border-color); }
        .logo { color: white; font-weight: bold; font-size: 1.4rem; text-decoration: none; }
        .container { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 60px); padding: 20px; }
        .forgot-card { background: var(--card-bg); width: 100%; max-width: 600px; border-radius: 10px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .card-header { background: var(--uv-purple); padding: 15px 25px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .card-body { padding: 30px; }
        .back-link { color: #ccc; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; margin-bottom: 20px; }
        input[type="email"] { width: 100%; padding: 12px; background: #0b0b15; border: 1px solid var(--border-color); border-radius: 5px; color: white; margin: 15px 0; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: var(--success-green); color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-submit:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">UV-PRO</a>
        <div style="display:flex; gap:20px;">
            <a href="compte.html" style="color:white; text-decoration:none;"><i class="fas fa-user"></i> Compte</a>
        </div>
    </nav>

    <div class="container">
        <div class="forgot-card">
            <div class="card-header"><i class="fas fa-lock"></i> Mot de passe oublié</div>
            <div class="card-body" id="card-content">
                <a href="compte.html" class="back-link"><i class="fas fa-chevron-left"></i> RETOUR</a>
                <h2>Récupérer votre mot de passe</h2>
                <p style="color:#aaa;">Saisissez votre email pour recevoir un lien de réinitialisation.</p>

                <form id="forgotForm">
                    <input type="email" id="email" placeholder="exemple@mail.com" required>
                    <button type="submit" class="btn-submit" id="btnText">Valider</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btnText');
            
            btn.disabled = true;
            btn.innerText = "Traitement...";

            try {
                const response = await fetch('https://uv-pro-back.onrender.com/mot-de-passe-oublie.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const result = await response.json();

                if(result.success) {
                    document.getElementById('card-content').innerHTML = `
                        <div style="text-align:center;">
                            <i class="fas fa-check-circle" style="font-size:3rem; color:#28a745; margin-bottom:15px;"></i>
                            <h3>Email envoyé !</h3>
                            <p>Vérifiez vos spams si vous ne voyez rien d'ici 2 minutes.</p>
                            <a href="compte.html" class="back-link" style="justify-content:center; margin-top:20px;">Retour à la connexion</a>
                        </div>`;
                } else {
                    alert(result.message);
                    btn.disabled = false;
                    btn.innerText = "Valider";
                }
            } catch (err) {
                alert("Erreur de connexion au serveur.");
                btn.disabled = false;
                btn.innerText = "Valider";
            }
        });
    </script>
</body>
</html>
