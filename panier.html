<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre Panier Cybertech | UV-PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #0f0f1a;
            --card-bg: #161625;
            --uv-purple: #a855f7;
            --text-main: #e0e0e0;
            --sub-text: #888;
            --border-color: #2a2a40;
            --success-green: #28a745;
            --warning-red: #ef4444;
            --nav-bg: #0a0a12; 
        }

        body {
            background-color: var(--dark-bg);
            font-family: 'Segoe UI', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* --- BARRE DE NAVIGATION --- */
        .top-nav {
            background-color: var(--nav-bg);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-right {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--uv-purple);
        }

        .cart-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #nav-cart-count {
            background: var(--uv-purple);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            position: absolute;
            top: -8px;
            left: 12px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        /* --- CONTENU --- */
        .main-content {
            padding: 40px 20px;
        }

        .cart-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .cart-left {
            flex: 3;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cart-item {
            display: flex;
            gap: 25px;
            padding: 25px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .item-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
            background: #0b0b15;
            padding: 5px;
            border-radius: 8px;
            border: 1px solid var(--uv-purple);
        }

        .item-details { flex: 1; }
        .item-title { font-size: 1.2rem; font-weight: bold; color: white; margin: 0 0 8px 0; }

        .cyber-qty-picker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b0b15;
            border: 2px solid var(--uv-purple);
            border-radius: 25px;
            padding: 5px 15px;
            min-width: 120px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .qty-btn {
            background: none;
            border: none;
            color: var(--uv-purple);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            transition: 0.2s;
            padding: 5px;
        }

        .qty-btn:hover { color: white; transform: scale(1.1); }
        
        .qty-number { 
            font-weight: bold; 
            color: white; 
            font-size: 1.3rem;
            min-width: 30px;
            text-align: center;
        }

        .item-price { font-size: 1.4rem; font-weight: bold; color: white; text-align: right; min-width: 100px; }

        .cart-right {
            flex: 1;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 80px;
        }

        .btn-checkout {
            display: block;
            width: 100%;
            background-color: var(--success-green);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        .btn-checkout:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);
        }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html" class="brand-logo">UV-PRO</a>
    
    <div class="nav-right">
        <a href="https://uv-pro-back.onrender.com/connexion.php?from=panier" class="nav-link" id="nav-account-link">
            <i class="fas fa-user" id="user-icon"></i> 
            <span id="account-text">Compte</span>
        </a>
        <a href="panier.html" class="nav-link">
            <div class="cart-wrapper">
                <i class="fas fa-shopping-basket"></i>
                <span id="nav-cart-count">1</span>
                <span>Panier</span>
            </div>
        </a>
    </div>
</nav>

<div class="main-content">
    <div class="cart-container">
        <div class="cart-left">
            <h1 style="color: white; margin-top: 0;">Votre Panier</h1>

            <div class="cart-item">
                <img src="lampe UV.jpg" alt="Lampe UV" class="item-image">
                
                <div class="item-details">
                    <p class="item-title">Lampe de poche UV Black Light, 51 LED 395 nM, détecteur haute puissance.</p>
                    
                    <div style="display: flex; align-items: center; gap: 20px; margin-top: 20px;">
                        <div class="cyber-qty-picker">
                            <button class="qty-btn" onclick="changeQty(-1)" title="Diminuer">
                                <i class="far fa-trash-alt"></i>
                            </button>
                            
                            <span class="qty-number" id="qty-val">1</span>
                            
                            <button class="qty-btn" onclick="changeQty(1)" title="Ajouter">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>

                        <div style="color: var(--sub-text); font-size: 0.85rem;">
                            <a href="#" style="color: var(--uv-purple); text-decoration: none;">Mettre de côté</a>
                        </div>
                    </div>
                </div>
                <div class="item-price" id="total-price">13,73 €</div>
            </div>
        </div>

        <div class="cart-right">
            <div style="margin-bottom:20px; color: white;">
                Sous-total (<span id="qty-summary">1</span> article) : <strong id="subtotal-right">13,73 €</strong>
            </div>
            <a href="validation-de-commande.html" id="btn-final-checkout" class="btn-checkout">Valider la commande</a>
        </div>
    </div>
</div>

<script>
    const unitPrice = 13.73;
    let currentQty = 1;

    function changeQty(amount) {
        currentQty += amount;
        if (currentQty < 1) currentQty = 1;

        document.getElementById('qty-val').innerText = currentQty;
        document.getElementById('qty-summary').innerText = currentQty;
        document.getElementById('nav-cart-count').innerText = currentQty;

        const newTotal = (currentQty * unitPrice).toFixed(2);
        const formattedTotal = newTotal.replace('.', ',') + " €";

        document.getElementById('total-price').innerText = formattedTotal;
        document.getElementById('subtotal-right').innerText = formattedTotal;

        document.getElementById('btn-final-checkout').href = "validation-de-commande.html?total=" + newTotal;
    }

    async function checkUserSession() {
        try {
            const response = await fetch('https://uv-pro-back.onrender.com/get-session.php', {
                credentials: 'include'
            });
            const data = await response.json();

            if (data.loggedIn) {
                document.getElementById('account-text').innerText = data.nom_affichage;
                // Le lien pointera vers ton futur fichier de profil sur Render
                document.getElementById('nav-account-link').href = "https://uv-pro-back.onrender.com/mon-profil.php";
                document.getElementById('user-icon').style.color = "#a855f7";
            }
        } catch (error) {
            console.error("Erreur lors de la récupération de la session:", error);
        }
    }

    window.addEventListener('DOMContentLoaded', checkUserSession);
</script>

</body>
</html>
