<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | UV-PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --uv-purple: #a855f7;
            --dark-bg: #0f0f1a;
            --card-bg: #161625;
            --success-green: #28a745;
            --nav-bg: #0a0a12;
            --border-color: #2a2a40;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- BARRE DE NAVIGATION SYNCHRONISÉE --- */
        .top-nav {
            background-color: var(--nav-bg);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-logo {
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-right {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover { color: var(--uv-purple); }

        .cart-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #nav-cart-count {
            background: var(--uv-purple);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            position: absolute;
            top: -8px;
            left: 12px;
            font-weight: bold;
        }

        /* --- CONTENEUR AUTH --- */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 60px);
            padding: 20px;
        }

        .auth-container {
            width: 90%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        h2 { color: var(--uv-purple); margin-top: 0; }

        .form-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #0b0b15;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background-color: var(--success-green);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-auth:hover { opacity: 0.9; }

        .extra-links {
            margin-top: 15px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Design original du lien conservé */
        a { color: var(--uv-purple); text-decoration: none; transition: 0.2s; }
        a:hover { text-decoration: underline; }

        .social-login {
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .social-icons i {
            font-size: 1.5rem;
            margin: 0 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .fa-google { color: #db4437; }
        .fa-facebook { color: #4267B2; }
        .fa-paypal { color: #003087; }

        @media (max-width: 768px) {
            .auth-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html" class="brand-logo">UV-PRO</a>
        
        <div class="nav-right">
            <a href="compte.html" class="nav-link">
                <i class="fas fa-user"></i> Compte
            </a>
            <a href="panier.html" class="nav-link">
                <div class="cart-wrapper">
                    <i class="fas fa-shopping-basket"></i>
                    <span id="nav-cart-count">1</span>
                    <span>Panier</span>
                </div>
            </a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Connexion</h2>
                <form action="login_process.php" method="POST">
                    <div class="form-group">
                        <label>Adresse email</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" name="password" required>
                    </div>
                    <div class="extra-links">
                        <label><input type="checkbox"> Rester connecté</label>
                        <a href="mot-de-passe-oublié.html">Mot de passe oublié ?</a>
                    </div>
                    <button type="submit" class="btn-auth">Se connecter</button>
                </form>

                <div class="social-login">
                    <p>Ou connectez-vous avec</p>
                    <div class="social-icons">
                        <i class="fab fa-google"></i>
                        <i class="fab fa-facebook"></i>
                        <i class="fab fa-paypal"></i>
                    </div>
                </div>
            </div>

            <div class="auth-card">
                <h2>Nouveau client</h2>
                <form action="register_process.php" method="POST">
                    <div class="form-group">
                        <label>Adresse email</label>
                        <input type="email" name="email" required>
                    </div>
                    <p style="font-size: 0.8rem; color: #888;">
                        En créant un compte, vous pourrez suivre vos commandes de lampe UV et gérer vos informations.
                    </p>
                    <a href="formulaire-inscription.html">
                        <button type="button" class="btn-auth">Créer un compte</button>
                    </a>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
