<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Sécurisé | UV-PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --uv-purple: #a855f7;
            --dark-bg: #0f0f1a;
            --card-bg: #161625;
            --border-color: #2a2a40;
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at top right, #1e1e3a, var(--dark-bg));
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .pay-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .secure-badge {
            font-size: 0.8em;
            color: #28a745;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h2 { font-size: 1.8em; margin-bottom: 10px; }

        .product-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px dashed #444;
        }

        .price {
            font-size: 2.8em;
            color: var(--uv-purple);
            font-weight: 800;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        #paypal-button-container { margin-top: 20px; }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75em;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="pay-container">
        <div class="secure-badge">
            <i class="fas fa-shield-alt"></i> Paiement 100% Sécurisé
        </div>
        
        <h2>Finaliser la commande</h2>
        
        <div class="product-box">
            <p style="color: #aaa; margin: 0;">Total de votre panier</p>
            <div class="price" id="display-price">13,73 €</div>
        </div>

        <div id="paypal-button-container"></div>

        <p class="footer-text">
            <i class="fas fa-lock"></i> Cryptage SSL 256-bits.
        </p>
    </div>

    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR"></script>
    <script>
        // 1. RÉCUPÉRER LE PRIX DEPUIS LE PANIER
        const urlParams = new URLSearchParams(window.location.search);
        let montantTotal = urlParams.get('total') || '13.73'; // 13.73 par défaut

        // 2. AFFICHER LE BON PRIX SUR LA PAGE
        document.getElementById('display-price').innerText = montantTotal.replace('.', ',') + " €";

        // 3. CONFIGURER PAYPAL
        paypal.Buttons({
            style: {
                layout: 'vertical',
                color:  'blue',
                shape:  'rect',
                label:  'pay'
            },
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: { value: montantTotal } // Le montant dynamique est ici !
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Merci pour votre achat, ' + details.payer.name.given_name + ' !');
                    window.location.href = "index.html"; // Redirection après achat
                });
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
